<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ACTERIM — Agent Vocal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .logo {
    font-size: 13px;
    letter-spacing: 0.15em;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .btn-record {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #111;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-record:active { transform: scale(0.95); }

  .btn-record.recording {
    border-color: #e74c3c;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.3); }
    50% { box-shadow: 0 0 0 20px rgba(231, 76, 60, 0); }
  }

  .mic-icon {
    font-size: 48px;
    line-height: 1;
  }

  .btn-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #555;
    text-transform: uppercase;
  }

  .btn-record.recording .btn-label { color: #e74c3c; }

  .status {
    margin-top: 2rem;
    font-size: 14px;
    color: #444;
    min-height: 20px;
    text-align: center;
    font-family: 'DM Mono', monospace;
  }

  .status.active { color: #e74c3c; }
  .status.success { color: #2ecc71; }
  .status.error { color: #e74c3c; }

  .transcript {
    margin-top: 1.5rem;
    width: 100%;
    max-width: 360px;
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    font-size: 14px;
    color: #888;
    min-height: 60px;
    line-height: 1.6;
    font-style: italic;
    display: none;
  }

  .transcript.visible { display: block; }

  .send-btn {
    margin-top: 1rem;
    width: 100%;
    max-width: 360px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #f0f0f0;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    display: none;
  }

  .send-btn.visible { display: block; }
  .send-btn:hover { background: #222; border-color: #444; }
  .send-btn:active { transform: scale(0.98); }

  .footer {
    margin-top: 3rem;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.08em;
    text-align: center;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #e74c3c;
    margin-right: 6px;
    vertical-align: middle;
    display: none;
  }
  .dot.visible { display: inline-block; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>

<div class="logo">ACTERIM — Agent Vocal</div>

<button class="btn-record" id="btnRecord" onclick="toggleRecord()">
  <span class="mic-icon">🎙</span>
  <span class="btn-label" id="btnLabel">Appuyer</span>
</button>

<div class="status" id="status">Prêt à enregistrer</div>
<span class="dot" id="dot"></span>

<div class="transcript" id="transcript"></div>

<button class="send-btn" id="sendBtn" onclick="sendToWebhook()">
  Envoyer au système →
</button>

<div class="footer">
  Parlez en français, roumain ou russe<br>
  Le système comprend les trois langues
</div>

<script>
const WEBHOOK = 'https://hook.eu1.make.com/hiel8k165yo9i9h3ylmxuvc8hqf3jb';

let recognition;
let isRecording = false;
let finalText = '';

const btnRecord = document.getElementById('btnRecord');
const btnLabel = document.getElementById('btnLabel');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const sendBtn = document.getElementById('sendBtn');
const dot = document.getElementById('dot');

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    statusEl.textContent = 'Reconnaissance vocale non supportée';
    statusEl.className = 'status error';
    return null;
  }
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'fr-FR';

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    transcriptEl.textContent = (finalText + interim).trim();
    transcriptEl.classList.add('visible');
  };

  r.onend = () => {
    isRecording = false;
    btnRecord.classList.remove('recording');
    btnLabel.textContent = 'Appuyer';
    dot.classList.remove('visible');
    if (finalText.trim()) {
      statusEl.textContent = 'Transcription terminée';
      statusEl.className = 'status success';
      sendBtn.classList.add('visible');
    } else {
      statusEl.textContent = 'Rien enregistré — réessayez';
      statusEl.className = 'status';
    }
  };

  r.onerror = (e) => {
    isRecording = false;
    btnRecord.classList.remove('recording');
    btnLabel.textContent = 'Appuyer';
    dot.classList.remove('visible');
    statusEl.textContent = 'Erreur: ' + e.error;
    statusEl.className = 'status error';
  };

  return r;
}

function toggleRecord() {
  if (!isRecording) {
    finalText = '';
    transcriptEl.textContent = '';
    transcriptEl.classList.remove('visible');
    sendBtn.classList.remove('visible');
    recognition = initRecognition();
    if (!recognition) return;
    recognition.start();
    isRecording = true;
    btnRecord.classList.add('recording');
    btnLabel.textContent = 'Stop';
    dot.classList.add('visible');
    statusEl.textContent = 'Écoute en cours...';
    statusEl.className = 'status active';
  } else {
    recognition.stop();
  }
}

async function sendToWebhook() {
  const text = finalText.trim();
  if (!text) return;

  sendBtn.textContent = 'Envoi en cours...';
  sendBtn.disabled = true;
  statusEl.textContent = 'Envoi au système...';
  statusEl.className = 'status active';

  try {
    await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    statusEl.textContent = '✓ Enregistré dans le système';
    statusEl.className = 'status success';
    sendBtn.textContent = 'Envoyé ✓';
    setTimeout(() => {
      sendBtn.classList.remove('visible');
      transcriptEl.classList.remove('visible');
      sendBtn.textContent = 'Envoyer au système →';
      sendBtn.disabled = false;
      statusEl.textContent = 'Prêt à enregistrer';
      statusEl.className = 'status';
      finalText = '';
    }, 3000);
  } catch (err) {
    statusEl.textContent = 'Erreur réseau — réessayez';
    statusEl.className = 'status error';
    sendBtn.textContent = 'Envoyer au système →';
    sendBtn.disabled = false;
  }
}
</script>
</body>
</html>
